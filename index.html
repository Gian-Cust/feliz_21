<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para alguien especial 🌻</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Montserrat:wght@300;500&display=swap');

        :root {
            --yellow: #ffdf00;
            --glow: #ffee00ad;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Pantalla de Inicio (El Sobre) */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a, #000);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .envelope {
            font-size: 80px;
            cursor: pointer;
            filter: drop-shadow(0 0 15px var(--yellow));
            transition: transform 0.3s;
        }

        .envelope:hover {
            transform: scale(1.1);
        }

        .click-text {
            margin-top: 20px;
            font-family: 'Dancing Script', cursive;
            color: var(--yellow);
            font-size: 1.5rem;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        /* Contenedor Principal */
        .container {
            text-align: center;
            max-width: 90%;
            z-index: 10;
            display: none;
            /* Se activa al hacer click */
        }

        .sunflower-main {
            font-size: 100px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px gold);
        }

        .message-box {
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 223, 0, 0.2);
        }

        .text-p {
            font-family: 'Great Vibes', cursive;
            font-size: 1.8rem;
            line-height: 1.6;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .highlight {
            color: var(--yellow);
            font-weight: bold;
            display: block;
            margin: 15px 0;
            font-size: 2.2rem;
            text-shadow: 0 0 10px var(--glow);
        }

        .kiss-line {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #ddd;
            border-left: 3px solid var(--yellow);
            padding-left: 15px;
            margin: 20px auto;
            max-width: 80%;
        }

        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--yellow);
            margin-top: 30px;
        }

        /* Lluvia de flores y partículas */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Estrellas de fondo */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>

<body>

    <!-- Pantalla de inicio -->
    <div id="overlay" onclick="startExperience()">
        <div class="envelope">✉️</div>
        <div class="click-text">Tengo un detalle para ti... <br> (Haz clic para abrir)</div>
    </div>

    <canvas id="stars"></canvas>

    <!-- Música de fondo -->
    <!-- He puesto un piano suave, puedes cambiar el link por cualquier archivo .mp3 -->
    <audio id="musica" loop>
        <source src="Musica/Camila  Todo Cambió [Letra].mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainContainer">
        <div class="sunflower-main">🌻</div>

        <div class="message-box">
            <p class="text-p">Hoy te entrego este ramito de <span style="color:var(--yellow)">flores amarillas.</span>
            </p>

            <p class="text-p">Son un símbolo de la alegría que traes a mis días y la felicidad que poco a poco he
                logrado conocer a tu lado.</p>

            <div class="kiss-line">
                "¡Todo comenzó, por ese beso que no te negaste!"
            </div>

            <div class="signature">
                ¡Feliz 21 de Marzo Lind.! 💛
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            // Iniciar música
            const audio = document.getElementById('musica');
            audio.play();

            // Ocultar overlay
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('mainContainer').style.animation = 'fadeInUp 2s forwards';
            }, 1000);

            // Iniciar lluvia de flores
            setInterval(createFlower, 300);
        }

        function createFlower() {
            const flower = document.createElement('div');
            const types = ['🌻', '🌼', '✨', '💛'];
            flower.className = 'particle';
            flower.innerHTML = types[Math.floor(Math.random() * types.length)];
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = Math.random() * (30 - 15) + 15 + 'px';
            flower.style.animationDuration = Math.random() * (6 - 3) + 3 + 's';
            flower.style.opacity = Math.random();
            document.body.appendChild(flower);

            setTimeout(() => { flower.remove(); }, 6000);
        }

        // Fondo de estrellas dinámico
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                blink: Math.random() * 0.05
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.size += Math.sin(Date.now() * 0.001 + s.x) * 0.01; // Efecto de parpadeo
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>

    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>

</html>
